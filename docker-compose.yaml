services:
  server:
    environment:
      - DATABASE_URL=db
    ports:
      - 8080:80

  db:
    image: postgres
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer
    ports:
      - 8080:8080